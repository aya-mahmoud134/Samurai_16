<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Samurai 16 - Reverse Engineering, Malware Analysis, CTF</title>
  <desc id="desc">A dark cyberpunk Japanese-inspired banner with a red moon, katana motif, and Samurai 16 lettering.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090d"/>
      <stop offset="0.58" stop-color="#111018"/>
      <stop offset="1" stop-color="#220b13"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7d8795"/>
      <stop offset="0.55" stop-color="#f4f5f7"/>
      <stop offset="1" stop-color="#8b98a8"/>
    </linearGradient>
    <radialGradient id="sun">
      <stop offset="0" stop-color="#ff5967" stop-opacity=".95"/>
      <stop offset="1" stop-color="#9d1729" stop-opacity=".75"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#ff4655" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)" opacity=".65"/>
  <path d="M0 286 L120 245 230 275 345 218 455 270 570 236 690 280 810 224 930 270 1050 220 1200 260V360H0Z" fill="#08090d" opacity=".9"/>
  <path d="M0 306 L160 278 275 302 420 270 550 308 710 268 855 303 1000 265 1200 300" fill="none" stroke="#8b1928" stroke-width="2" opacity=".6"/>
  <circle cx="920" cy="128" r="91" fill="url(#sun)" filter="url(#glow)"/>
  <path d="M829 128H1011M920 37V219M856 64L984 192M984 64L856 192" stroke="#ffb2b8" stroke-opacity=".18" stroke-width="1"/>
  <path d="M840 156 Q920 183 1000 156" fill="none" stroke="#260b12" stroke-width="10" opacity=".65"/>
  <g transform="translate(900 75) rotate(29)">
    <rect x="-6" y="-5" width="12" height="145" rx="5" fill="#16181f" stroke="#c5cbd3" stroke-width="2"/>
    <path d="M0 -8 L0 -190" stroke="url(#blade)" stroke-width="7" stroke-linecap="round"/>
    <path d="M-22 3H22" stroke="#d7dbe2" stroke-width="7" stroke-linecap="round"/>
    <path d="M-7 17L7 29M-7 35L7 47M-7 53L7 65M-7 71L7 83" stroke="#a52a3a" stroke-width="4"/>
  </g>

  <g fill="none" stroke="#ff4655" stroke-width="2" opacity=".8">
    <path d="M62 62H190M62 62V92"/>
    <path d="M1138 298H1010M1138 298V268"/>
  </g>
  <g font-family="monospace" fill="#ff6673">
    <text x="64" y="53" font-size="13" letter-spacing="4">FIELD NOTES // 016</text>
    <text x="1136" y="322" font-size="11" text-anchor="end" letter-spacing="3">静寂 • 精密 • 探索</text>
  </g>
  <text x="64" y="163" fill="#f4f4f5" font-family="monospace" font-size="70" font-weight="700" letter-spacing="5">SAMURAI_16</text>
  <rect x="67" y="184" width="390" height="3" fill="#ff4655"/>
  <text x="67" y="224" fill="#d7d9df" font-family="monospace" font-size="19" letter-spacing="3">REVERSE ENGINEERING</text>
  <text x="67" y="255" fill="#d7d9df" font-family="monospace" font-size="19" letter-spacing="3">MALWARE ANALYSIS  //  CTF</text>
  <text x="67" y="315" fill="#9ca3af" font-family="monospace" font-size="12" letter-spacing="2">ANALYZE THE CODE. TRACE THE THREAT. FIND THE FLAG.</text>
  <path d="M64 337H470" stroke="#ff4655" stroke-opacity=".5"/>
</svg>